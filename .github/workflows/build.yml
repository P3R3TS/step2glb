name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: step2glb-windows
            ext: .exe
          - os: ubuntu-latest
            platform: linux
            artifact_name: step2glb-linux
            ext: ''
          - os: macos-latest
            platform: macos
            artifact_name: step2glb-macos
            ext: ''

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: python build/build_all.py --mode both --no-venv

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: python build/build_all.py --mode portable --no-venv

      - name: Build (macOS)
        if: matrix.platform == 'macos'
        run: python build/build_all.py --mode portable --no-venv

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-portable
          path: |
            dist/step2glb${{ matrix.ext }}
            dist/step2glb-*.zip
            dist/step2glb-*.tar.gz
          if-no-files-found: warn
          retention-days: 30

      - name: Upload installer (Windows only)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-installer
          path: |
            installer/*.exe
          if-no-files-found: warn
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
