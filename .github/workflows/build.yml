name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: step2glb-windows
          - os: ubuntu-latest
            platform: linux
            artifact_name: step2glb-linux
          - os: macos-latest
            platform: macos
            artifact_name: step2glb-macos

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: python build/build_all.py --version ${{ steps.version.outputs.version }} --mode both --no-venv

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: python build/build_all.py --version ${{ steps.version.outputs.version }} --mode portable --no-venv

      - name: Build (macOS)
        if: matrix.platform == 'macos'
        run: python build/build_all.py --version ${{ steps.version.outputs.version }} --mode portable --no-venv

      - name: Upload exe (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-portable
          path: dist/step2glb.exe
          if-no-files-found: error
          retention-days: 5

      - name: Upload installer (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-installer
          path: installer/*.exe
          if-no-files-found: error
          retention-days: 5

      - name: Upload binary (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-portable
          path: dist/step2glb
          if-no-files-found: error
          retention-days: 5

      - name: Upload binary or zip (macOS)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-portable
          path: |
            dist/step2glb
            dist/step2glb-*.zip
          if-no-files-found: error
          retention-days: 5

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Flatten and rename artifacts with platform
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          mkdir -p release
          cd artifacts
          for artifact_dir in */; do
            dir="${artifact_dir%/}"
            echo "Processing artifact: ${dir}"
            find "${dir}" -maxdepth 1 -type f | while read -r f; do
              name="$(basename "$f")"
              case "${dir}" in
                *windows*installer*)
                  cp "$f" "../release/step2glb-setup-${VERSION}.exe"
                  ;;
                *windows*portable*)
                  cp "$f" "../release/step2glb-${VERSION}-windows.exe"
                  ;;
                *linux*)
                  cp "$f" "../release/step2glb-${VERSION}-linux"
                  ;;
                *macos*)
                  cp "$f" "../release/step2glb-${VERSION}-macos"
                  ;;
                *)
                  echo "  [skip] unknown artifact dir: ${dir}"
                  ;;
              esac
            done
          done
          cd ..
          echo "=== Release files ==="
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
